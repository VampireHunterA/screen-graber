name: Build debug APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          case "$RUNNER_TEMP" in
            /*) ;;
            *) echo "RUNNER_TEMP is not an absolute path" >&2; exit 1 ;;
          esac
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/screen-graber.jks"
          test -s "$RUNNER_TEMP/screen-graber.jks"
          echo "Keystore prepared"

      - name: Build debug APK
        shell: bash
        env:
          SCREENGRABER_KEYSTORE: ${{ runner.temp }}/screen-graber.jks
          SCREENGRABER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SCREENGRABER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SCREENGRABER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee build-log.txt

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/screen-graber.jks"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-graber-build-log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screen-graber-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
